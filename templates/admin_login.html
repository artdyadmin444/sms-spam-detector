{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ Admin | SMS Guard AI{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="panel p-4 p-lg-5">
  <span class="eyebrow">RESTRICTED ACCESS</span><h1 class="h3 fw-bold mt-2">เข้าสู่ระบบผู้ดูแล</h1><p class="text-secondary">เฉพาะผู้ดูแลที่กำหนดค่าไว้ในไฟล์ .env</p>
  <form method="post">
    <div class="mb-3"><label class="form-label" for="username">ชื่อผู้ใช้</label><input class="form-control" id="username" name="username" autocomplete="username" required maxlength="100"></div>
    <div class="mb-3"><label class="form-label" for="password">รหัสผ่าน</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary w-100" type="submit">เข้าสู่ระบบ</button>
  </form>
</div></div>
{% endblock %}
